<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SARAS · Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #FFFFFF;
    --off:   #F7F6F3;
    --line:  #E5E3DC;
    --ink:   #0D0D0B;
    --mid:   #6A6A64;
    --faint: #B5B5AD;
    --gold:  #C4A055;
    --gold-dim: rgba(196,160,85,0.12);
    --gold-glow: rgba(196,160,85,0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--ink);
    color: var(--white);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* Native titlebar is used — no custom titlebar needed */

  /* ── MAIN STAGE ── */
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Subtle radial glow behind content */
  .stage::before {
    content: '';
    position: absolute;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(196,160,85,0.07) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* Fine grain texture overlay */
  .stage::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.4;
  }

  /* ── CARD ── */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 0 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Decorative thin line top */
  .card-rule {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, transparent, var(--gold));
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.6s 0.1s cubic-bezier(0.22,1,0.36,1) forwards;
  }

  /* Logo image */
  .logo-mark {
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 0.6s 0.2s cubic-bezier(0.22,1,0.36,1) forwards;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-img {
    width: 40px;
    height: 40px;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(196,160,85,0.5));
  }

  /* Headline */
  .headline {
    font-family: 'Playfair Display', serif;
    font-size: 1.55rem;
    font-weight: 400;
    line-height: 1.45;
    text-align: center;
    color: var(--white);
    margin-bottom: 10px;
    opacity: 0;
    animation: fadeUp 0.6s 0.3s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .headline em {
    font-style: italic;
    color: var(--gold);
  }

  /* Sub copy */
  .sub {
    font-size: 0.8rem;
    font-weight: 300;
    color: var(--faint);
    text-align: center;
    letter-spacing: 0.04em;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.6s 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
  }

  /* Input group */
  .input-group {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    opacity: 0;
    animation: fadeUp 0.6s 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
  }

  .input-label {
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.18em;
    color: var(--faint);
    text-transform: uppercase;
  }

  .input-wrap {
    position: relative;
  }

  .license-input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(229,227,220,0.14);
    border-radius: 4px;
    padding: 14px 16px;
    font-family: 'Outfit', sans-serif;
    font-size: 0.88rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: var(--white);
    outline: none;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    caret-color: var(--gold);
  }
  .license-input::placeholder {
    color: rgba(181,181,173,0.35);
    letter-spacing: 0.2em;
    font-size: 0.82rem;
  }
  .license-input:focus {
    border-color: rgba(196,160,85,0.5);
    background: rgba(196,160,85,0.04);
    box-shadow: 0 0 0 3px rgba(196,160,85,0.08);
  }

  /* CTA button */
  .cta-btn {
    width: 100%;
    margin-top: 4px;
    padding: 14px;
    background: var(--gold);
    border: none;
    border-radius: 4px;
    font-family: 'Outfit', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
    transition: opacity 0.15s, transform 0.15s, box-shadow 0.2s;
    -webkit-app-region: no-drag;
  }
  .cta-btn:hover {
    opacity: 0.88;
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(196,160,85,0.25);
  }
  .cta-btn:active {
    transform: translateY(0);
    opacity: 1;
  }
  .cta-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* Error / hint */
  .hint {
    font-size: 0.72rem;
    font-weight: 300;
    color: var(--faint);
    letter-spacing: 0.04em;
    text-align: center;
    min-height: 18px;
    transition: color 0.2s;
  }
  .hint.error { color: #FF7A6B; }
  .hint.success { color: var(--gold); }

  /* Bottom rule */
  .bottom-rule {
    width: 1px;
    height: 32px;
    background: linear-gradient(to bottom, var(--gold), transparent);
    margin-top: 28px;
    opacity: 0;
    animation: fadeUp 0.6s 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
  }

  /* Consent row */
  .consent-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    margin-top: 2px;
  }

  .consent-checkbox {
    appearance: none;
    -webkit-appearance: none;
    flex-shrink: 0;
    width: 15px;
    height: 15px;
    margin-top: 1px;
    border: 1px solid rgba(229,227,220,0.28);
    border-radius: 2px;
    background: rgba(255,255,255,0.04);
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .consent-checkbox:hover {
    border-color: rgba(196,160,85,0.55);
    background: rgba(196,160,85,0.06);
  }
  .consent-checkbox:checked {
    background: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 0 8px rgba(196,160,85,0.3);
  }
  .consent-checkbox:checked::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 1.5px;
    width: 4px;
    height: 7px;
    border: 1.5px solid var(--ink);
    border-top: none;
    border-left: none;
    transform: rotate(45deg);
  }

  .consent-label {
    font-size: 0.7rem;
    font-weight: 300;
    color: var(--faint);
    letter-spacing: 0.03em;
    line-height: 1.55;
    cursor: pointer;
  }
  .consent-label a {
    color: var(--gold);
    text-decoration: none;
    border-bottom: 1px solid rgba(196,160,85,0.3);
    transition: border-color 0.15s, color 0.15s;
  }
  .consent-label a:hover {
    color: #d4b065;
    border-bottom-color: rgba(196,160,85,0.7);
  }

  /* Footer note */
  .footer-note {
    position: absolute;
    bottom: 18px;
    font-size: 0.68rem;
    font-weight: 300;
    color: rgba(181,181,173,0.3);
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

  <!-- Stage -->
  <div class="stage">

    <div class="card">

      <div class="card-rule"></div>

      <div class="logo-mark">
        <img src="../assets/lotus_coin_v2.ico" alt="SARAS" class="logo-img" />
      </div>

      <h1 class="headline">
        Hey, glad you got <em>SARAS!</em><br>
        Let us get you the experience<br>in simplified word search.
      </h1>

      <p class="sub">Enter your license key to activate</p>

      <div class="input-group">
        <label class="input-label">License ID</label>

        <div class="input-wrap">
          <input
            id="licenseInput"
            class="license-input"
            type="text"
            placeholder="Enter your license key"
            maxlength="40"
            autocomplete="off"
            spellcheck="false"
            oninput="onLicenseInput(this)"
            onkeydown="if(event.key==='Enter') activate()"
          />
        </div>

        <div class="consent-row">
          <input type="checkbox" id="consentCheck" class="consent-checkbox" onchange="onConsentChange()" />
          <label class="consent-label" for="consentCheck">
            By activating SARAS you agree to our
            <a href="https://getsaras.com/accounts/tos/" target="_blank">Terms of Service</a>
            and
            <a href="https://getsaras.com/accounts/privacy_policy/" target="_blank">Privacy Policy</a>
          </label>
        </div>

        <button id="ctaBtn" class="cta-btn" onclick="activate()" disabled>
          Activate SARAS
        </button>

        <p id="hint" class="hint">Your license key was emailed to you on purchase.</p>
      </div>

      <div class="bottom-rule"></div>
    </div>

    <span class="footer-note">© 2025 SARAS · Made for curious readers</span>

  </div>

<script>
const { ipcRenderer } = require('electron');

function win(action) { ipcRenderer.send('window-' + action); }

// Enable button only when license ≥6 chars AND consent is checked
function updateBtn() {
  const key     = document.getElementById('licenseInput').value.trim();
  const consent = document.getElementById('consentCheck').checked;
  document.getElementById('ctaBtn').disabled = key.length < 6 || !consent;
}

function onLicenseInput(input) {
  const hint = document.getElementById('hint');
  hint.textContent = 'Your license key was emailed to you on purchase.';
  hint.className = 'hint';
  updateBtn();
}

function onConsentChange() {
  updateBtn();
}

async function activate() {
  const key  = document.getElementById('licenseInput').value.trim();
  const hint = document.getElementById('hint');
  const btn  = document.getElementById('ctaBtn');

  if (key.length < 6) return;

  btn.disabled = true;
  btn.textContent = 'Verifying…';
  hint.textContent = '';
  hint.className = 'hint';

  try {
    const res  = await fetch('http://127.0.0.1:5000/activate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ license_key: key })
    });
    const data = await res.json();

    if (data.success) {
      hint.textContent = `Welcome, ${data.first_name}! Opening SARAS…`;
      hint.className = 'hint success';
      setTimeout(() => ipcRenderer.send('navigate-to-main'), 1200);
    } else {
      hint.textContent = data.error || 'Invalid license key. Please try again.';
      hint.className = 'hint error';
      btn.disabled = false;
      btn.textContent = 'Activate SARAS';
    }
  } catch (e) {
    hint.textContent = 'Could not connect. Make sure SARAS is running.';
    hint.className = 'hint error';
    btn.disabled = false;
    btn.textContent = 'Activate SARAS';
  }
}
</script>

</body>
</html>
